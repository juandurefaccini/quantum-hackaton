<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qards — variantes (aspect 5:7)</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ============================================================
       NORMA: toda carta es 5:7 (ancho:alto). Nada de alturas fijas.
       ============================================================ */
    :root {
      --qard-w: 170px;
      --qard-aspect: 5 / 7;
    }

    body {
      background-color: #0d0f12;
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      min-height: 100vh;
      padding: 34px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    header.page-head h1 { font-size: 26px; letter-spacing: .14em; text-transform: uppercase; }
    header.page-head p { color: #8b93a3; font-size: 13px; margin-top: 4px; }
    header.page-head .norm { color: #22b3a0; }
    header.page-head a { color: #c07bff; }

    /* ---------------- carta base (de cards/index.html) ---------------- */
    .qard-minimal {
      width: var(--qard-w);
      aspect-ratio: var(--qard-aspect);
      height: auto;
      border-radius: 18px;
      border: 3px solid #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.7);
      user-select: none;
      background-color: #0d1117;
    }

    .half-0 { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 0 100%); }
    .half-1 { position: absolute; inset: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }

    .diagonal-line {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom right, transparent calc(50% - 1px), rgba(255,255,255,0.814) 50%, transparent calc(50% + 1px));
    }

    .red { background-color: #d31815; }
    .blue { background-color: #1c24be; }
    .yellow { background-color: #e4d82e; }
    .green { background-color: #1ba91d; }
    .dark { background-color: #000000; }

    .symbols-layer { position: absolute; inset: 0; pointer-events: none; }
    .sym { position: absolute; font-size: 3.6rem; font-weight: 300; color: #fff; line-height: 1; }
    .sym-0 { top: 30%; left: 30%; transform: translate(-50%, -50%); }
    .sym-1 { bottom: 30%; right: 30%; transform: translate(50%, 50%); }
    .sym-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

    .content { position: absolute; inset: 0; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
    .header { display: flex; justify-content: flex-start; }
    .footer { display: flex; justify-content: flex-end; }
    .ket-badge { font-size: 1.2rem; font-weight: 300; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
    .full-bg { position: absolute; inset: 0; }

    /* ---------------- layout de la galería ---------------- */
    .variant {
      background: #14171d;
      border: 2px solid #0b0a09;
      box-shadow: 7px 7px 0 rgba(0,0,0,0.5);
      padding: 16px 18px 22px;
    }
    .variant-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .vtag { font-weight: 700; font-size: 13px; color: #e6b23a; background: #0d0f12; border: 2px solid #0b0a09; padding: 2px 7px; }
    .variant-head strong { font-size: 16px; letter-spacing: .04em; }
    .fam { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border: 1px solid #0b0a09; color: #8b93a3; background: rgba(255,255,255,.05); }
    .fam-split { color: #e6b23a; background: rgba(230,178,58,.12); }
    .fam-look { color: #c07bff; background: rgba(192,123,255,.12); }
    .fam-theme { color: #22b3a0; background: rgba(34,179,160,.12); }
    .variant p.desc { color: #8b93a3; font-size: 12px; margin-bottom: 16px; }
    .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }

    /* ============================================================
       VARIANTES
       ============================================================ */

    /* v2 · split vertical */
    .qard-v2 .half-0 { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
    .qard-v2 .half-1 { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
    .qard-v2 .diagonal-line { background: linear-gradient(to right, transparent calc(50% - 1px), rgba(255,255,255,0.8) 50%, transparent calc(50% + 1px)); }
    .qard-v2 .sym-0 { top: 28%; left: 25%; }
    .qard-v2 .sym-1 { bottom: 28%; right: 25%; }

    /* v3 · split horizontal */
    .qard-v3 .half-0 { clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); }
    .qard-v3 .half-1 { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); }
    .qard-v3 .diagonal-line { background: linear-gradient(to bottom, transparent calc(50% - 1px), rgba(255,255,255,0.8) 50%, transparent calc(50% + 1px)); }
    .qard-v3 .sym-0 { top: 25%; left: 50%; }
    .qard-v3 .sym-1 { bottom: 25%; right: 50%; transform: translate(50%, 50%); }

    /* v4 · diagonal invertida */
    .qard-v4 .half-0 { clip-path: polygon(0 0, 100% 0, 100% 100%); }
    .qard-v4 .half-1 { clip-path: polygon(0 0, 0 100%, 100% 100%); }
    .qard-v4 .diagonal-line { background: linear-gradient(to bottom left, transparent calc(50% - 1px), rgba(255,255,255,0.8) 50%, transparent calc(50% + 1px)); }
    .qard-v4 .sym-0 { top: 30%; left: auto; right: 30%; transform: translate(50%, -50%); }
    .qard-v4 .sym-1 { bottom: 30%; right: auto; left: 30%; transform: translate(-50%, 50%); }

    /* v5 · esquinas (kets protagonistas) */
    .qard-v5 { border: 2px solid rgba(255,255,255,0.92); border-radius: 8px; }
    .qard-v5 .sym { font-size: 2.4rem; }
    .qard-v5 .ket-badge { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.03em; }

    /* v6 · neón */
    .qard-v6 {
      border: 2px solid #22b3a0; border-radius: 16px; background: #05100e;
      box-shadow: 0 0 24px rgba(34,179,160,0.45), 0 14px 30px rgba(0,0,0,0.7);
    }
    .qard-v6 .diagonal-line { background: linear-gradient(to bottom right, transparent calc(50% - 1.5px), #22b3a0 50%, transparent calc(50% + 1.5px)); }
    .qard-v6 .sym, .qard-v6 .ket-badge { color: #eafffb; text-shadow: 0 0 10px rgba(34,179,160,0.95); }

    /* v7 · fundido (superposición difusa, sin corte duro) */
    .qard-v7 .half-1 { mix-blend-mode: screen; opacity: 0.82; }
    .qard-v7 .diagonal-line { background: linear-gradient(to bottom right, transparent 34%, rgba(255,255,255,0.34) 50%, transparent 66%); filter: blur(2px); }
    .qard-v7 .sym { opacity: 0.92; }

    /* v8 · terminal / pixel */
    .qard-v8 { border: 2px solid #1f7a5e; border-radius: 4px; background: #04120a; box-shadow: 0 0 16px rgba(47,174,106,0.35); }
    .qard-v8 .sym, .qard-v8 .ket-badge { font-family: ui-monospace, "SFMono-Regular", monospace; color: #7dffb0; text-shadow: 0 0 6px rgba(47,174,106,0.8); }
    .qard-v8 .diagonal-line { background: linear-gradient(to bottom right, transparent calc(50% - 1px), #1f7a5e 50%, transparent calc(50% + 1px)); }
    .qard-v8::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.25) 0 1px, transparent 1px 3px); }

    /* v9 · blanca (tema claro) */
    .qard-v9 { background: #f4efe4; border: 2px solid #1b1a18; border-radius: 14px; box-shadow: 0 10px 24px rgba(0,0,0,0.5); }
    .qard-v9 .sym, .qard-v9 .ket-badge { color: #1b1a18; text-shadow: none; }
    .qard-v9 .diagonal-line { background: linear-gradient(to bottom right, transparent calc(50% - 1px), rgba(0,0,0,0.5) 50%, transparent calc(50% + 1px)); }

    /* v10 · con probabilidad (kets con %) */
    .qard-v10 .ket-badge { font-size: 1rem; background: rgba(0,0,0,0.55); padding: 2px 7px; border-radius: 6px; }
    .qard-v10 .header .ket-badge::after { content: " 50%"; opacity: 0.7; }
    .qard-v10 .footer .ket-badge::after { content: " 50%"; opacity: 0.7; }
    .qard-v10.classic .header .ket-badge::after, .qard-v10.classic .footer .ket-badge::after { content: ""; }
  </style>
</head>
<body>

  <header class="page-head">
    <h1>Qards — variantes</h1>
    <p>Variantes del diseño diagonal + kets de <a href="./index.html">cards/index.html</a>. Norma de aspecto: <span class="norm">5:7</span> (ancho:alto) en todas las cartas.</p>
  </header>

  <div id="board"></div>

  <script>
    const VARIANTS = [
      { id: 1, family: 'split', name: 'Original', desc: 'Split diagonal, borde blanco 3px, esquinas 18, kets |0⟩ / |1⟩.' },
      { id: 2, family: 'split', name: 'Split vertical', desc: 'Dos mitades izquierda / derecha con línea vertical.' },
      { id: 3, family: 'split', name: 'Split horizontal', desc: 'Dos mitades arriba / abajo (como la superposición del juego).' },
      { id: 4, family: 'split', name: 'Diagonal invertida', desc: 'Corte por la anti-diagonal (arriba-derecha / abajo-izquierda).' },
      { id: 5, family: 'look', name: 'Esquinas', desc: 'Borde fino y kets grandes: el estado cuántico manda.' },
      { id: 6, family: 'look', name: 'Neón', desc: 'Base oscura, costura teal con glow y símbolos incandescentes.' },
      { id: 7, family: 'look', name: 'Fundido', desc: 'Sin corte duro: las mitades se mezclan (superposición difusa).' },
      { id: 8, family: 'theme', name: 'Terminal', desc: 'Verde fósforo, scanlines y tipografía mono.' },
      { id: 9, family: 'theme', name: 'Blanca', desc: 'Tema claro con costura oscura.' },
      { id: 10, family: 'look', name: 'Con probabilidad', desc: 'Los kets muestran su probabilidad (50% / 50%).' },
    ];

    // Estados de ejemplo, iguales en todas las variantes.
    const SAMPLES = [
      { kind: 'quantum', c0: 'red', s0: '7', c1: 'blue', s1: '2' },
      { kind: 'quantum', c0: 'dark', s0: '★', c1: 'red', s1: '+4' },
      { kind: 'classic', color: 'green', symbol: '+2' },
      { kind: 'classic', color: 'red', symbol: '7' },
    ];

    function build(variant, s) {
      const el = document.createElement('div');
      el.className = `qard-minimal qard-v${variant}`;
      if (s.kind === 'quantum') {
        el.innerHTML = `
          <div class="half-0 ${s.c0}"></div>
          <div class="half-1 ${s.c1}"></div>
          <div class="diagonal-line"></div>
          <div class="symbols-layer">
            <span class="sym sym-0">${s.s0}</span>
            <span class="sym sym-1">${s.s1}</span>
          </div>
          <div class="content">
            <div class="header"><span class="ket-badge">|0⟩</span></div>
            <div class="footer"><span class="ket-badge">|1⟩</span></div>
          </div>`;
      } else {
        el.classList.add('classic');
        el.innerHTML = `
          <div class="full-bg ${s.color}"></div>
          <div class="symbols-layer"><span class="sym sym-center">${s.symbol}</span></div>
          <div class="content">
            <div class="header"><span class="ket-badge">${s.symbol}</span></div>
            <div class="footer"><span class="ket-badge">${s.symbol}</span></div>
          </div>`;
      }
      return el;
    }

    const board = document.getElementById('board');
    for (const v of VARIANTS) {
      const section = document.createElement('section');
      section.className = 'variant';
      section.innerHTML = `
        <div class="variant-head">
          <span class="vtag">v${v.id}</span>
          <strong>${v.name}</strong>
          <span class="fam fam-${v.family}">${v.family}</span>
        </div>
        <p class="desc">${v.desc}</p>
        <div class="row"></div>`;
      const row = section.querySelector('.row');
      SAMPLES.forEach(s => row.appendChild(build(v.id, s)));
      board.appendChild(section);
    }
  </script>
</body>
</html>
