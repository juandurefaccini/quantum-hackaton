<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qards - Cuánticas y Clásicas con Hover Simétrico</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0f12;
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 30px;
    }

    .board {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* CONTENEDOR DE CARTA BASE (5:7) */
    .qard-card {
      width: 200px;
      height: 280px;
      border-radius: 18px;
      border: 2px solid #ffffff;
      position: relative;
      background-color: #0d1117;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.7);
      user-select: none;
      overflow: hidden;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* LIENZO INTERNO DE COLOR */
    .inner-canvas {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      transition: inset 0.25s ease, border-radius 0.25s ease;
    }

    /* FONDOS Y GRADIENTES */
    .full-bg {
      position: absolute;
      inset: 0;
    }

    .half-0 {
      position: absolute;
      inset: 0;
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .half-1 {
      position: absolute;
      inset: 0;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .diagonal-line {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom right,
        transparent calc(50% - 1px),
        rgba(255, 255, 255, 0.4) 50%,
        transparent calc(50% + 1px)
      );
      pointer-events: none;
    }
 
      /* GRADIENTES COMPILADOS EN CSS */
    .grad-red {
      background: radial-gradient(circle at 30% 30%, #e53935 0%, #5e1212 100%);
    }

    .grad-blue {
      background: radial-gradient(circle at 30% 30%, #1e28e5 0%, #12056f 100%);
    }

    .grad-green {
      background: radial-gradient(circle at 30% 30%, #33b435 0%, #1f5b17 100%);
    }

    .grad-yellow {
      background: radial-gradient(circle at 30% 30%, #fff458 0%, #b19a09 100%);
    }

    .grad-grey {
      background: radial-gradient(circle at 30% 30%, #2c2130 0%, #0d1117 100%);
    }


    /* SÍMBOLOS CENTRALES */
    .symbols-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .sym {
      position: absolute;
      font-size: 3.8rem;
      font-weight: 300;
      color: #ffffff;
      line-height: 1;
    }

    .sym-0 { top: 30%; left: 30%; transform: translate(-50%, -50%); }
    .sym-1 { bottom: 30%; right: 30%; transform: translate(50%, 50%); }
    .sym-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

    /* CAPAS DE TEXTO EXTERNAS */
    .header, .footer {
      position: absolute;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      height: 24px;
    }

    .header { top: 6px; }
    .footer { bottom: 6px; }
    .footer.classic-footer { justify-content: flex-end; }

    .ket-badge {
      font-size: 0.95rem;
      font-weight: 300;
      color: #ffffff;
      transition: color 0.25s ease;
    }

    .phase-badge, .prob-badge {
      font-size: 0.65rem;
      font-weight: 700;
      color: #000000;
      opacity: 0;
      transition: opacity 0.2s ease;
      letter-spacing: 0.3px;
    }

    /* ========================================================
       EFECTO HOVER COMPARTIDO (MANTIONALA SIMETRÍA VISUAL)
       ======================================================== */
    .qard-card:hover {
      background-color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.45);
    }

    .qard-card:hover .inner-canvas {
      inset: 34px 8px 34px 8px;
      border-radius: 34px 0px 34px 0px;
    }

    .qard-card:hover .ket-badge {
      color: #000000;
      font-weight: 500;
    }

    .qard-card:hover .phase-badge,
    .qard-card:hover .prob-badge {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="board" class="board"></div>

  <script>
    // 1. CARTA CUÁNTICA
    function createQard({ color0, sym0, color1, sym1, prob0 = 50, phase = '+' }) {
      const el = document.createElement('div');
      el.className = 'qard-card';

      const prob1 = 100 - prob0;

      el.innerHTML = `
        <div class="header">
          <span class="ket-badge">|0⟩</span>
          <span class="phase-badge">FASE: ${phase} |${phase}⟩</span>
        </div>

        <div class="inner-canvas">
          <div class="half-0 grad-${color0}"></div>
          <div class="half-1 grad-${color1}"></div>
          <div class="diagonal-line"></div>

          <div class="symbols-layer">
            <span class="sym sym-0">${sym0}</span>
            <span class="sym sym-1">${sym1}</span>
          </div>
        </div>

        <div class="footer">
          <span class="prob-badge">PROBABILITY: ${prob0}% | ${prob1}%</span>
          <span class="ket-badge">|1⟩</span>
        </div>
      `;

      return el;
    }

    // 2. CARTA CLÁSICA / NORMAL
    function createClassicQard({ color, symbol }) {
      const el = document.createElement('div');
      el.className = 'qard-card';

      el.innerHTML = `
        <div class="header">
          <span class="ket-badge">${symbol}</span>
        </div>

        <div class="inner-canvas">
          <div class="full-bg grad-${color}"></div>

          <div class="symbols-layer">
            <span class="sym sym-center">${symbol}</span>
          </div>
        </div>

        <div class="footer classic-footer">
          <span class="ket-badge">${symbol}</span>
        </div>
      `;

      return el;
    }

    // RENDERS DE MUESTRA
    const board = document.getElementById('board');

    board.appendChild(createQard({ color0: 'red', sym0: '7', color1: 'blue', sym1: '2', prob0: 50, phase: '+' }));
    board.appendChild(createClassicQard({ color: 'red', symbol: '7' }));
    board.appendChild(createQard({ color0: 'green', sym0: 'Ø', color1: 'yellow', sym1: '+2', prob0: 75, phase: '-' }));
    board.appendChild(createClassicQard({ color: 'blue', symbol: '⇄' }));
  </script>
</body>
</html>
