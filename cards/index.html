<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qards - Cuánticas y Clásicas con Hover Simétrico</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0f12;
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 30px;
    }

    .board {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="board" class="board"></div>

  <script type="module">
    import { createQard, createClassicQard } from './qard.js';

    const board = document.getElementById('board');

    board.append(
      createQard({ color0: 'red', sym0: '7', color1: 'blue', sym1: '2', prob0: 50, phase: '+' }),
      createClassicQard({ color: 'red', symbol: '7' }),
      createQard({ color0: 'green', sym0: 'Ø', color1: 'yellow', sym1: '+2', prob0: 75, phase: '-' }),
      createClassicQard({ color: 'blue', symbol: '⇄' }),
    );
  </script>
</body>
</html>
